<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sladkiygramm - GOD MODE UI</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #0e1621;
            --surface: #17212b;
            --primary: #ff453a; /* Красный цвет админки */
            --text: #fff;
            --text-sec: #7c8895;
            --msg-me: #2b5278;
            --msg-other: #182533;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* ЭКРАНЫ */
        .screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .screen.active { display: flex; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ШАПКА */
        .header { height: 56px; background: var(--surface); display: flex; align-items: center; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); border-bottom: 2px solid var(--primary); z-index: 20; }
        .header-title { font-weight: bold; font-size: 18px; flex: 1; margin-left: 15px; }
        .back-btn { font-size: 20px; padding: 10px; cursor: pointer; color: #ccc; }

        /* СПИСКИ */
        .list-wrap { flex: 1; overflow-y: auto; }
        .item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .item:active { background: #202b36; }
        
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-right: 15px; color: #aaa; }
        .info { flex: 1; min-width: 0; }
        .name { font-size: 16px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { font-size: 12px; color: var(--text-sec); margin-top: 3px; }

        /* ЧАТ */
        .chat-bg { background-image: radial-gradient(#17212b 1px, transparent 1px); background-size: 20px 20px; }
        .msgs-area { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 15px; word-wrap: break-word; position: relative; }
        .msg-me { background: var(--msg-me); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: var(--msg-other); align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .msg-name { font-size: 10px; font-weight: bold; margin-bottom: 2px; color: #64b5f6; opacity: 0.8; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 4px; }
        
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .msg audio { max-width: 200px; height: 32px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: СПИСОК ВСЕХ ПОЛЬЗОВАТЕЛЕЙ -->
    <div id="screen-users" class="screen active">
        <div class="header">
            <i class="fas fa-users" style="color:var(--primary)"></i>
            <div class="header-title">Пользователи</div>
            <div id="status" style="font-size:11px; color:#aaa;">Загрузка...</div>
        </div>
        <div id="list-users" class="list-wrap"></div>
    </div>

    <!-- ЭКРАН 2: С КЕМ ОН ОБЩАЛСЯ -->
    <div id="screen-targets" class="screen">
        <div class="header">
            <i class="fas fa-arrow-left back-btn" onclick="goBack('screen-users')"></i>
            <div class="header-title" id="target-header-title">Контакты</div>
        </div>
        <div style="padding:10px; text-align:center; color:#555; font-size:12px;">
            Список найден через базу сообщений
        </div>
        <div id="list-targets" class="list-wrap"></div>
    </div>

    <!-- ЭКРАН 3: ЧАТ -->
    <div id="screen-chat" class="screen chat-bg">
        <div class="header">
            <i class="fas fa-arrow-left back-btn" onclick="goBack('screen-targets')"></i>
            <div class="header-title" id="chat-header-names">Чат</div>
        </div>
        <div id="messages" class="msgs-area"></div>
    </div>

    <script>
        // ✅ ТВОИ КЛЮЧИ
        const firebaseConfig = {
          apiKey: "AIzaSyAZV-wGHssi2yCMef3RlEszAadVOut7xsk",
          authDomain: "sladkiygramm.firebaseapp.com",
          databaseURL: "https://sladkiygramm-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "sladkiygramm",
          storageBucket: "sladkiygramm.firebasestorage.app",
          messagingSenderId: "1086842108736",
          appId: "1:1086842108736:web:d761262aa25a9c5e2918a5",
          measurementId: "G-1JX59628TB"
        };

        let db;
        let usersMap = {}; // ID -> Nick
        let allChatsKeys = []; // Список ключей из messages (id1_id2)
        
        let currentVictimId = null;
        let currentVictimName = "";
        let chatListener = null;

        window.onload = () => {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            initApp();
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goBack(toId) {
            if(toId === 'screen-targets' && chatListener) chatListener.off();
            showScreen(toId);
        }

        // --- ГЛАВНАЯ ЗАГРУЗКА ---
        function initApp() {
            // 1. Сначала грузим имена
            db.ref('users').on('value', uSnap => {
                usersMap = {};
                if(uSnap.exists()) {
                    const d = uSnap.val();
                    Object.keys(d).forEach(k => {
                        usersMap[k] = d[k].nick || k;
                    });
                }
                
                // 2. Потом сканируем ВСЕ чаты из messages
                db.ref('messages').on('value', mSnap => {
                    allChatsKeys = [];
                    if(mSnap.exists()) {
                        allChatsKeys = Object.keys(mSnap.val());
                    }
                    renderUserList();
                });
            });
        }

        // --- РИСУЕМ ЭКРАН 1: СПИСОК ЛЮДЕЙ ---
        function renderUserList() {
            const list = document.getElementById('list-users');
            list.innerHTML = '';

            // Собираем всех участников всех чатов
            let activeIds = new Set(Object.keys(usersMap));

            allChatsKeys.forEach(key => {
                const parts = key.split('_');
                if(parts.length === 2) {
                    activeIds.add(parts[0]);
                    activeIds.add(parts[1]);
                }
            });

            document.getElementById('status').innerText = `Найдено: ${activeIds.size}`;

            if(activeIds.size === 0) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:#555">База пуста</div>';
                return;
            }

            activeIds.forEach(uid => {
                const name = usersMap[uid] || uid;
                const isUnknown = !usersMap[uid];

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div class="avatar" style="${isUnknown ? 'border:2px solid #555' : ''}">
                        ${name[0] ? name[0].toUpperCase() : '?'}
                    </div>
                    <div class="info">
                        <div class="name">${name}</div>
                        <div class="sub">${isUnknown ? 'Только ID (нет в users)' : 'Пользователь'}</div>
                    </div>
                    <i class="fas fa-chevron-right" style="color:#555"></i>
                `;
                div.onclick = () => openVictimContacts(uid, name);
                list.appendChild(div);
            });
        }

        // --- ЭКРАН 2: СПИСОК КОНТАКТОВ ВЫБРАННОГО ---
        function openVictimContacts(uid, name) {
            currentVictimId = uid;
            currentVictimName = name;
            document.getElementById('target-header-title').innerText = name;

            const list = document.getElementById('list-targets');
            list.innerHTML = '';
            
            // Ищем в списке всех чатов те, где есть наш ID
            let foundCount = 0;

            allChatsKeys.forEach(chatKey => {
                if(chatKey.includes(uid)) {
                    const parts = chatKey.split('_');
                    if(parts.length !== 2) return;

                    // Определяем ID собеседника
                    let otherId = null;
                    if(parts[0] === uid) otherId = parts[1];
                    else if(parts[1] === uid) otherId = parts[0];

                    if(otherId) {
                        foundCount++;
                        const otherName = usersMap[otherId] || otherId;
                        
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.innerHTML = `
                            <div class="avatar" style="background:#2b5278"><i class="fas fa-user-secret"></i></div>
                            <div class="info">
                                <div class="name">${otherName}</div>
                                <div class="sub">Нажмите для чтения</div>
                            </div>
                            <i class="fas fa-comment-dots" style="color:#777"></i>
                        `;
                        div.onclick = () => openChat(chatKey, otherName);
                        list.appendChild(div);
                    }
                }
            });

            if(foundCount === 0) {
                list.innerHTML = '<div style="padding:40px;text-align:center;color:#555">Переписок не найдено</div>';
            }
            
            showScreen('screen-targets');
        }

        // --- ЭКРАН 3: ЧАТ ---
        function openChat(chatKey, otherName) {
            const area = document.getElementById('messages');
            document.getElementById('chat-header-names').innerText = `${currentVictimName} ↔ ${otherName}`;
            area.innerHTML = '<div style="text-align:center;padding:20px;color:#555">Загрузка...</div>';
            
            showScreen('screen-chat');

            if(chatListener) chatListener.off();

            chatListener = db.ref(`messages/${chatKey}`).limitToLast(100);
            
            let isFirst = true;
            chatListener.on('child_added', s => {
                if(isFirst) { area.innerHTML = ''; isFirst = false; }
                const m = s.val();
                drawMsg(m, otherName);
            });
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function safeDate(msg) {
            let ts = msg.t || msg.timestamp || msg.time || msg.date || msg.createdAt;
            if (!ts) return "";
            if (ts < 10000000000) ts *= 1000;
            const date = new Date(ts);
            if (isNaN(date.getTime())) return "";
            return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', day:'numeric', month:'numeric'});
        }

        function drawMsg(m, otherName) {
            const area = document.getElementById('messages');
            const div = document.createElement('div');
            
            // Если сообщение от того, кого мы выбрали в начале (Жертва) -> Вправо
            const isVictim = (m.from === currentVictimId);
            div.className = isVictim ? 'msg msg-me' : 'msg msg-other';
            
            const senderName = isVictim ? currentVictimName : otherName;
            
            let rawText = m.val || m.text || m.message || "";
            let content = "";

            if(m.type === 'text' || !m.type) content = rawText.replace(/</g, "&lt;");
            else if(m.type === 'img') content = `<img src="${rawText}" onclick="window.open(this.src)">`;
            else if(m.type === 'voice') content = `<audio controls src="${rawText}"></audio>`;
            
            if(content === "") content = "<i>(Нет данных)</i>";

            div.innerHTML = `
                <div class="msg-name">${senderName}</div>
                <div>${content}</div>
                <div class="msg-time">${safeDate(m)}</div>
            `;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
    </script>
</body>
</html>
